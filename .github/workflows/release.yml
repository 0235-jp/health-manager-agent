name: Release

on:
  release:
    types: [published]

jobs:
  build-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install plugin dependencies
        run: |
          for dir in plugins/*/; do
            (cd "$dir" && pnpm install)
          done

      - name: Build plugins
        run: pnpm plugins:build:zip

      - name: Upload plugin assets
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/*/dist/*.zip
